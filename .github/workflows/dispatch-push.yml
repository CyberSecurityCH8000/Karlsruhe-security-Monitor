name: Push-Unwetterwarnungen – ersetzt durch Supabase Cron
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase übernimmt die automatische Prüfung
        run: echo "DWD-Push wird alle 15 Minuten über Supabase pg_cron geplant; GitHub Secrets werden nicht benötigt."
