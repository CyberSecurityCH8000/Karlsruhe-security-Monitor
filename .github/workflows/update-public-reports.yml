name: Polizei und Verkehrsmeldungen aktualisieren
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: karlsruhe-monitor-data-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Öffentliche Meldungen laden
        run: python3 scripts/update_public_reports.py
      - name: Daten veröffentlichen
        run: |
          if ! git diff --quiet -- public-reports.json || [ -n "$(git ls-files --others --exclude-standard public-reports.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public-reports.json
            git commit -m "Update public police and transit reports"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Veröffentlichung nach fünf Versuchen fehlgeschlagen" >&2
            exit 1
          fi
