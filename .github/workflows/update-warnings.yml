name: Amtliche Warnungen aktualisieren
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-warnings.yml'
      - 'scripts/**'
permissions:
  contents: write
concurrency:
  group: karlsruhe-monitor-data-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Warnungen laden und validieren
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, pathlib
          url = "https://warnung.bund.de/api31/dashboard/082120000000.json"
          req = urllib.request.Request(url, headers={"User-Agent":"KarlsruheSecurityMonitor/1.0", "Accept":"application/json"})
          with urllib.request.urlopen(req, timeout=25) as response:
              data = json.load(response)
          if not isinstance(data, list):
              raise ValueError("Unexpected warning payload")
          output = {"updated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(), "source":url, "warnings":data}
          pathlib.Path("warnings.json").write_text(json.dumps(output,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print(f"Validated {len(data)} warnings")
          PY
      - name: Geprüfte Daten veröffentlichen
        run: |
          if ! git diff --quiet -- warnings.json || [ -n "$(git ls-files --others --exclude-standard warnings.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add warnings.json
            git commit -m "Update amtliche Warnungen"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Veröffentlichung nach fünf Versuchen fehlgeschlagen" >&2
            exit 1
          fi
